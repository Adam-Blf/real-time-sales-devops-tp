# Paramètres non secrets partagés. Les hôtes sont les noms des Services Kubernetes, pas ceux du compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sales-config
  namespace: sales
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: sales.orders
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: sales
  POSTGRES_USER: sales
